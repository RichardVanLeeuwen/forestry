[package]
name = "forestry"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/RichardVanLeeuwen/forestry"

[dependencies]
auth-git2 = "0.6"
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
git2 = "0.21"
ratatui = "0.30"
regex = "1.13"
throbber-widgets-tui = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-input = "0.15"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
